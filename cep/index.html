<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KAI MCP Bridge</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; padding: 8px 10px; box-sizing: border-box; background: #232323; color: #ddd; font: 12px/1.45 -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  .ok { color: #7ee2a0; } .busy { color: #f5d16b; } .bad { color: #ff8a80; } .muted { color: #8a8a8a; }
  #top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #state { font-size: 13px; font-weight: 600; }
  #detail, #last { font-size: 11px; } #last { display: none; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #9a9a9a; margin: 10px 0 4px; }
  #ask { display: none; background: #2f3a52; border: 1px solid #4a6ab0; border-radius: 6px; padding: 8px; margin-top: 8px; }
  #ask .q { font-size: 13px; color: #fff; margin-bottom: 8px; }
  #ask .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 4px 12px; cursor: pointer; background: #3d3d3d; color: #eee; }
  button.primary { background: #3b6fe0; color: #fff; }
  button:hover { filter: brightness(1.15); }
  #planBox { display: none; }
  #planTitle { color: #eee; font-weight: 600; margin-bottom: 2px; }
  .step { display: flex; gap: 6px; align-items: flex-start; padding: 1px 0; color: #bbb; }
  .step.done { color: #8a8a8a; } .step.cur { color: #fff; }
  #feedBox { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #feed { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .ev { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; border-bottom: 1px solid #2c2c2c; }
  .ev .tx { flex: 1 1 auto; min-width: 0; }
  .ev .meta { flex: none; color: #777; font-size: 10px; padding-top: 1px; }
  .ev.say .tx { color: #fff; }
  .ev.warn .tx { color: #f5d16b; }
  .ev .err { color: #ff8a80; font-size: 11px; }
  .tag { font-size: 9px; padding: 0 4px; border-radius: 3px; margin-left: 4px; vertical-align: 1px; }
  .tag.ae { background: #2a2a55; color: #9b9bff; } .tag.pr { background: #2a2a55; color: #c9a0ff; } .tag.il { background: #4a3315; color: #ffb35c; }
  svg.ic { flex: none; width: 12px; height: 12px; margin-top: 2px; }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  #empty { color: #777; font-size: 11px; }
  #tabs { display: flex; gap: 4px; margin-top: 8px; border-bottom: 1px solid #333; }
  .tab { background: none; border-radius: 0; padding: 4px 10px; color: #999; border-bottom: 2px solid transparent; display: flex; gap: 5px; align-items: center; }
  .tab.on { color: #fff; border-bottom-color: #3b6fe0; }
  .pane { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; } .pane.on { display: flex; }
  #chatLog { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 6px; }
  .msg { margin: 3px 0; padding: 6px 8px; border-radius: 8px; max-width: 92%; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: #3b6fe0; color: #fff; }
  .msg.cl { align-self: flex-start; background: #2e2e2e; color: #e6e6e6; }
  .msg.err { align-self: stretch; background: #3a2525; color: #ffb3ab; font-size: 11px; }
  .msg .m { color: #777; font-size: 10px; margin-top: 3px; }
  .working { display: flex; gap: 6px; align-items: flex-start; color: #c9c9c9; font-size: 11px; padding: 4px 2px; }
  .hint { color: #777; font-size: 11px; padding: 8px 2px; }
  #chatBar { display: flex; gap: 6px; align-items: flex-end; padding-top: 6px; }
  #chatInput { flex: 1 1 auto; resize: none; height: 46px; background: #1b1b1b; color: #eee; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px; font: inherit; }
  #chatInput:focus { outline: none; border-color: #3b6fe0; }
  #chatBtns { display: flex; flex-direction: column; gap: 4px; }
</style></head>
<body>
  <div id="top"><span id="state" class="muted">Starting…</span><span id="detail" class="muted"></span></div>
  <div id="last" class="muted"></div>
  <div id="ask"><div class="q" id="askQ"></div><div class="btns" id="askBtns"></div></div>
  <div id="tabs">
    <button class="tab on" data-p="chatPane"><svg class="ic" viewBox="0 0 12 12"><path d="M2 2.5h8v5H5.5L3 9.8V7.5H2z" fill="currentColor"/></svg>Chat</button>
    <button class="tab" data-p="actPane"><svg class="ic" viewBox="0 0 12 12"><path d="M1 6h2.2l1.5-3.5 2.6 7 1.5-3.5H11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Activity</button>
  </div>
  <div id="chatPane" class="pane on">
    <div id="chatLog"></div>
    <div id="chatBar"><textarea id="chatInput" placeholder="Ask Claude to do something…"></textarea>
      <div id="chatBtns"><button id="chatSend" class="primary">Send</button><button id="chatNew" title="Start a new chat">New</button></div></div>
  </div>
  <div id="actPane" class="pane">
    <div id="planBox"><h2>Plan</h2><div id="planTitle"></div><div id="plan"></div></div>
    <div id="feedBox"><h2>What Claude is doing</h2><div id="feed"><div id="empty">Nothing yet. Steps show up here while Claude works.</div></div></div>
  </div>
  <script src="main.js"></script>
  <script src="activity_ui.js"></script>
  <script src="chat.js"></script>
  <script>
  (function () { var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].onclick = function () {
      for (var j = 0; j < tabs.length; j++) { tabs[j].classList.toggle('on', tabs[j] === this); document.getElementById(tabs[j].getAttribute('data-p')).classList.toggle('on', tabs[j] === this); }
      window.dispatchEvent(new Event('resize')); }; }());
  </script>
</body></html>
